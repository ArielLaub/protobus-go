name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  # The suites never default to a broker; these point them at the service
  # containers below.
  PROTOBUS_TEST_AMQP_URL: amqp://guest:guest@127.0.0.1:25672/
  PROTOBUS_TEST_MGMT_URL: http://guest:guest@127.0.0.1:25673

jobs:
  unit:
    name: unit (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.25.x", "stable"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: test (race, leak-checked)
        # Broker suites skip themselves here: no broker variables are set.
        run: env -u PROTOBUS_TEST_AMQP_URL -u PROTOBUS_TEST_MGMT_URL go test -race -count=1 ./...
      - name: fuzz the envelope decoders
        run: |
          for f in FuzzDecodeRequest FuzzDecodeResponse FuzzDecodeEvent; do
            go test -run XXX -fuzz "^$f\$" -fuzztime 20s ./internal/wire
          done

  generated:
    name: generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - name: regenerate with the protobus CLI
        run: |
          go run ./cmd/protobus generate -proto crosslang/proto -out crosslang/gen
          for ex in calculator tokenstream combat; do
            go run ./cmd/protobus generate -proto examples/$ex/proto -out examples/$ex/gen
          done
      - name: no diff
        run: git diff --exit-code

  integration:
    name: integration (RabbitMQ ${{ matrix.rabbitmq }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rabbitmq: ["3-management", "4-management"]
    services:
      rabbitmq:
        image: rabbitmq:${{ matrix.rabbitmq }}
        ports:
          - 25672:5672
          - 25673:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - name: integration suite
        run: go test -race -count=1 -v ./integration/...
      - name: examples run end to end
        env:
          AMQP_URL: amqp://guest:guest@127.0.0.1:25672/
          LOG_LEVEL: warn
        run: |
          go run ./examples/calculator
          go run ./examples/tokenstream
          go run ./examples/combat

  cross-language:
    name: cross-language (Go <-> TypeScript <-> Python)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 25672:5672
          - 25673:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: protobus-go
      # The peers are pinned: bump deliberately, after their own CI passes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArielLaub/protobus
          ref: ba7a9bd1694159bd6c4caf749f6551fc493a482e # 2.4.0
          path: protobus
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArielLaub/protobus-py
          ref: 5e2e8fca0674b9d9efbf2945f10ef903797b9cdd # 2.0.0
          path: protobus-py
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: protobus-go/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: build the TypeScript port
        working-directory: protobus
        run: npm ci && npm run build-ts
      - name: install the Python port
        working-directory: protobus-py
        run: python -m venv venv && venv/bin/pip install -e .
      - name: cross-language suite
        working-directory: protobus-go
        env:
          PROTOBUS_TS: ${{ github.workspace }}/protobus
          PROTOBUS_PY: ${{ github.workspace }}/protobus-py
        run: go test -count=1 -v ./crosslang/...
